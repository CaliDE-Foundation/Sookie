name: Build

on:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fedora 45 (x86_64)
    runs-on: ubuntu-latest
    # Same base distro as upstream Mutter CI, so `dnf builddep mutter`
    # pulls in dependencies new enough for this branch.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            'dnf-command(builddep)' git tar xz
          dnf builddep -y --setopt=install_weak_deps=False mutter

      - name: Check out Sookie
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: |
          meson setup build \
            --prefix=/usr \
            --buildtype=debugoptimized \
            --wrap-mode=nofallback \
            -Dtests=disabled \
            -Dmutter_tests=false \
            -Dclutter_tests=false \
            -Dcogl_tests=false \
            -Dinstalled_tests=false

      - name: Compile
        run: meson compile -C build

      - name: Install to staging directory
        run: |
          DESTDIR="$PWD/stage" meson install -C build --no-rebuild
          tar -C stage -cJf sookie-x86_64.tar.xz .

      - name: Check installed names
        run: |
          set -e
          for f in usr/bin/sookie \
                   usr/lib64/libsookie-52.so \
                   usr/lib64/pkgconfig/libsookie-52.pc \
                   usr/lib64/sookie-52 \
                   usr/include/sookie-52 \
                   usr/libexec/sookie-x11-frames \
                   usr/libexec/sookie-backlight-helper; do
            test -e "stage/$f" || { echo "missing: $f"; exit 1; }
          done
          if find stage -name '*mutter*' -not -path '*/glib-2.0/schemas/*' \
               -not -path '*/dbus-1/*' -not -path '*/locale/*' \
               -not -path '*/icons/*' -not -path '*/applications/*' \
               -not -path '*/include/*' | grep .; then
            echo "files above still carry the Mutter name"
          fi
          PKG_CONFIG_PATH=stage/usr/lib64/pkgconfig pkg-config --print-requires libsookie-52

      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sookie-fedora45-x86_64
          path: sookie-x86_64.tar.xz
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: meson-logs
          path: build/meson-logs/

  test:
    name: Unit tests (Fedora 45)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 90
    steps:
      - name: Install build and test dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            'dnf-command(builddep)' git python3-dbusmock python3-gobject \
            mesa-dri-drivers dbus-daemon xorg-x11-server-Xwayland
          dnf builddep -y --setopt=install_weak_deps=False mutter

      - name: Check out Sookie
        uses: actions/checkout@v7.0.1

      - name: Configure with tests
        run: |
          meson setup build --buildtype=debugoptimized --wrap-mode=nofallback \
            -Dtests=enabled -Dmutter_tests=true -Dclutter_tests=false \
            -Dcogl_tests=false -Dinstalled_tests=false -Dprofiler=false

      - name: Build
        run: meson compile -C build

      - name: Run layer geometry tests
        run: meson test -C build layer-layout --print-errorlogs

      - name: Run unit tests
        run: meson test -C build --suite mutter/unit --print-errorlogs --num-processes 2

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs
          path: build/meson-logs/

  # Preserve the legacy main-channel release (nightly). Development branch
  # builds use nightly-dev so neither branch overwrites the other's binaries.
  publish:
    name: Publish development nightly
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sookie-fedora45-x86_64

      - name: Update nightly release
        run: |
          echo "${GITHUB_SHA}" > sookie-x86_64.commit
          if gh release view nightly-dev -R "$REPO" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/nightly-dev" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create nightly-dev -R "$REPO" --prerelease \
              --target "$GITHUB_SHA" --title "Sookie development nightly" --notes "pending"
          fi
          gh release upload nightly-dev -R "$REPO" --clobber \
            sookie-x86_64.tar.xz sookie-x86_64.commit
          gh release edit nightly-dev -R "$REPO" --notes "$(printf '%s\n\n%s' \
            "Latest build of \`nightly\`: ${GITHUB_SHA}. Built on Fedora 45 (x86_64)." \
            "Extract over \`/\` on Fedora 45, or use CaliDE's experimental Devkit.")"
