name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fedora 45 (x86_64)
    runs-on: ubuntu-latest
    # Same base distro as upstream Mutter CI, so `dnf builddep mutter`
    # pulls in dependencies new enough for this branch.
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            'dnf-command(builddep)' git tar xz
          dnf builddep -y --setopt=install_weak_deps=False mutter

      - name: Check out Sookie
        uses: actions/checkout@v4

      - name: Configure
        run: |
          meson setup build \
            --prefix=/usr \
            --buildtype=debugoptimized \
            --wrap-mode=nofallback \
            -Dtests=disabled \
            -Dmutter_tests=false \
            -Dclutter_tests=false \
            -Dcogl_tests=false \
            -Dinstalled_tests=false

      - name: Compile
        run: meson compile -C build

      - name: Install to staging directory
        run: |
          DESTDIR="$PWD/stage" meson install -C build --no-rebuild
          tar -C stage -cJf sookie-x86_64.tar.xz .

      - name: Check installed names
        run: |
          set -e
          for f in usr/bin/sookie \
                   usr/lib64/libsookie-52.so \
                   usr/lib64/pkgconfig/libsookie-52.pc \
                   usr/lib64/sookie-52 \
                   usr/include/sookie-52 \
                   usr/libexec/sookie-x11-frames \
                   usr/libexec/sookie-backlight-helper; do
            test -e "stage/$f" || { echo "missing: $f"; exit 1; }
          done
          if find stage -name '*mutter*' -not -path '*/glib-2.0/schemas/*' \
               -not -path '*/dbus-1/*' -not -path '*/locale/*' \
               -not -path '*/icons/*' -not -path '*/applications/*' \
               -not -path '*/include/*' | grep .; then
            echo "files above still carry the Mutter name"
          fi
          PKG_CONFIG_PATH=stage/usr/lib64/pkgconfig pkg-config --print-requires libsookie-52

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sookie-fedora45-x86_64
          path: sookie-x86_64.tar.xz
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
